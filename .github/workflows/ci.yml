name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar
        run: dotnet restore

      - name: Compilar
        run: dotnet build -c Release --no-restore

      - name: Testar
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=resultados.trx"

      - name: Resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-de-teste
          path: '**/TestResults/*.trx'
